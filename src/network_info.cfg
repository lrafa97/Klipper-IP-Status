# Prints the IP addresses of the machine (Wi-Fi, cable and USB) in the console.
#
# The work is done by the Moonraker component "network_info"
# (src/network_info.py). This macro only asks for it.
# Needs [respond] in the Klipper config (Mainsail's mainsail.cfg already has it).
[gcode_macro SHOW_IP_ADDRESS]
description: Show the IP addresses of this machine (Wi-Fi, cable and USB)
gcode:
  {action_call_remote_method("network_info_show")}
